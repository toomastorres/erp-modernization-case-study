<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Comparativa de proveedores de ERP y modelo de TCO">
  <rect width="900" height="420" rx="10" fill="#f5f7fa"/>
  <text x="28" y="40" fill="#1e3a5f" font-size="18" font-weight="800">Evaluación de ERP — matriz de decisión y TCO (ilustrativo)</text>

  <!-- Panel izquierdo: puntaje ponderado por proveedor -->
  <text x="28" y="74" fill="#334155" font-size="13" font-weight="700">Puntaje ponderado (1–5)</text>
  <g font-size="12">
    <!-- escala -->
    <line x1="150" y1="92" x2="150" y2="232" stroke="#cbd5e1"/>
    <!-- SAP B1: 3.4 -->
    <text x="28" y="112" fill="#475569">SAP B1</text>
    <rect x="150" y="100" width="190" height="22" rx="3" fill="#9fb4cc"/>
    <text x="348" y="116" fill="#1e3a5f" font-weight="700">3.4</text>
    <!-- D365 BC: 4.7 (destacado) -->
    <text x="28" y="146" fill="#1e3a5f" font-weight="800">D365 BC ★</text>
    <rect x="150" y="134" width="262" height="22" rx="3" fill="#1e3a5f"/>
    <text x="420" y="150" fill="#1e3a5f" font-weight="800">4.7</text>
    <!-- Softland: 3.9 -->
    <text x="28" y="180" fill="#475569">Softland</text>
    <rect x="150" y="168" width="218" height="22" rx="3" fill="#9fb4cc"/>
    <text x="376" y="184" fill="#1e3a5f" font-weight="700">3.9</text>
    <!-- Condor: 3.5 -->
    <text x="28" y="214" fill="#475569">Condor</text>
    <rect x="150" y="202" width="196" height="22" rx="3" fill="#9fb4cc"/>
    <text x="354" y="218" fill="#1e3a5f" font-weight="700">3.5</text>
  </g>
  <text x="28" y="252" fill="#64748b" font-size="10.5">Criterios: ajuste funcional, TCO, nube, integración, soporte local, escalabilidad.</text>

  <!-- Panel derecho: TCO antes/después -->
  <text x="520" y="74" fill="#334155" font-size="13" font-weight="700">Costo mensual IT (TCO)</text>
  <g>
    <line x1="560" y1="92" x2="560" y2="232" stroke="#cbd5e1"/>
    <!-- actual 100% -->
    <text x="520" y="124" fill="#475569" font-size="12" text-anchor="end" transform="rotate(0)">Actual</text>
    <rect x="560" y="104" width="300" height="36" rx="4" fill="#b42318"/>
    <text x="850" y="127" fill="#fff" font-size="12" text-anchor="end" font-weight="700">100%</text>
    <!-- propuesto -->
    <text x="520" y="186" fill="#475569" font-size="12" text-anchor="end">Propuesto</text>
    <rect x="560" y="166" width="204" height="36" rx="4" fill="#217346"/>
    <text x="754" y="189" fill="#fff" font-size="12" text-anchor="end" font-weight="700">~XX%</text>
  </g>
  <text x="520" y="252" fill="#64748b" font-size="10.5">D365 BC + M365 en la nube · consolidación + fin del servidor físico.</text>

  <!-- Recomendación -->
  <rect x="28" y="280" width="844" height="112" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="308" fill="#1e3a5f" font-size="14" font-weight="800">Recomendación: Microsoft Dynamics 365 Business Central + Microsoft 365 (nube)</text>
  <g font-size="12" fill="#334155">
    <text x="48" y="334">✓ Consolida ERP + correo + ofimática + BI en un mismo ecosistema (menos licencias dispersas).</text>
    <text x="48" y="356">✓ Elimina el servidor físico on-premise → continuidad, respaldo y seguridad gestionados.</text>
    <text x="48" y="378">✓ API abierta para integrar las herramientas internas ya desarrolladas.</text>
  </g>
</svg>
